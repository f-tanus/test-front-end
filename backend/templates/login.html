<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RuralSys</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a202c 0%, #2d3748 100%);
            padding: 2rem;
        }
        .login-card {
            background: #fff;
            border-radius: 16px;
            padding: 3rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-header .icon {
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 1rem;
        }
        .login-header h1 {
            font-size: 1.8rem;
            color: var(--text);
            margin-bottom: 0.5rem;
        }
        .login-header h1 i {
            color: var(--primary);
        }
        .login-header p {
            color: var(--text-light);
            font-size: 0.9rem;
        }
        .login-form .form-group {
            margin-bottom: 1.5rem;
        }
        .login-form .form-group label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text);
        }
        .login-form .form-group label i {
            color: var(--primary);
            width: 18px;
        }
        .login-form .form-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.2s;
        }
        .login-form .form-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(46, 204, 113, 0.15);
            outline: none;
        }
        .login-btn {
            width: 100%;
            padding: 0.9rem;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .login-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }
        .login-btn:active {
            transform: translateY(0);
        }
        .error-message {
            background: rgba(231, 76, 60, 0.1);
            color: #e74c3c;
            padding: 0.8rem 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            border: 1px solid rgba(231, 76, 60, 0.2);
        }
        .login-footer {
            text-align: center;
            margin-top: 1.5rem;
            color: var(--text-light);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="icon"><i class="fas fa-tractor"></i></div>
                <h1>RuralSys</h1>
                <p>Sistema de Gestão de Produtos Rurais</p>
            </div>

            {% if error %}
            <div class="error-message">
                <i class="fas fa-exclamation-circle"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form class="login-form" method="POST" action="/login" autocomplete="off">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Usuário</label>
                    <input type="text" name="username" placeholder="Digite seu usuário" required autofocus>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Senha</label>
                    <input type="password" name="password" placeholder="Digite sua senha" required>
                </div>
                <button type="submit" class="login-btn">
                    <i class="fas fa-sign-in-alt"></i> Entrar
                </button>
            </form>
            <div class="login-footer">
                <p>&copy; 2026 RuralSys. Todos os direitos reservados.</p>
            </div>
        </div>
    </div>
</body>
</html>
