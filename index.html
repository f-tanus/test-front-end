<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>&#x1F9C0; Queijaria Corp - Gestão de Vendas & Materiais</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="src/styles/global.css">
</head>

<body>
    <div id="app">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <div class="brand-icon">&#x1F9C0;</div>
                <div class="brand-text">
                    <span class="brand-title">Queijaria Corp</span>
                    <span class="brand-subtitle">Sistema de Gestão</span>
                </div>
            </div>
            <nav class="sidebar-nav" id="sidebar-nav">
                <a href="#/" class="nav-item active" data-route="dashboard">
                    <i class="fas fa-chart-pie"></i>
                    <span>Dashboard</span>
                </a>
                <a href="#/produtos" class="nav-item" data-route="produtos">
                    <i class="fas fa-cheese"></i>
                    <span>Produtos</span>
                </a>
                <a href="#/materiais" class="nav-item" data-route="materiais">
                    <i class="fas fa-boxes"></i>
                    <span>Materiais</span>
                </a>
                <a href="#/vendas" class="nav-item" data-route="vendas">
                    <i class="fas fa-shopping-cart"></i>
                    <span>Vendas</span>
                </a>
                <a href="#/relatorios" class="nav-item" data-route="relatorios">
                    <i class="fas fa-file-alt"></i>
                    <span>Relatórios</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="user-avatar">FT</div>
                    <div class="user-details">
                        <span class="user-name">Admin</span>
                        <span class="user-role">Gerente</span>
                    </div>
                </div>
                <button class="sidebar-toggle" id="sidebar-toggle">
                    <i class="fas fa-chevron-left"></i>
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Header Bar -->
            <header class="top-header">
                <div class="header-left">
                    <button class="mobile-menu-btn" id="mobile-menu-btn">
                        <i class="fas fa-bars"></i>
                    </button>
                    <div class="page-title">
                        <h1 id="page-title">Dashboard</h1>
                        <p id="page-subtitle">Visão geral do negócio</p>
                    </div>
                </div>
                <div class="header-right">
                    <div class="header-search">
                        <i class="fas fa-search"></i>
                        <input type="text" placeholder="Pesquisar..." id="global-search">
                    </div>
                    <button class="header-btn" title="Notificações">
                        <i class="fas fa-bell"></i>
                        <span class="notification-badge">3</span>
                    </button>
                    <button class="header-btn" title="Configurações">
                        <i class="fas fa-cog"></i>
                    </button>
                    <button class="header-btn" title="Atualizar" id="btn-refresh">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>
            </header>

            <!-- Page Content -->
            <div class="content-wrapper" id="content-wrapper">
                <!-- Dynamic content rendered here -->
            </div>
        </main>

        <!-- Mobile Overlay -->
        <div class="sidebar-overlay" id="sidebar-overlay"></div>
    </div>

    <!-- Chart.js for charts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="src/data.js"></script>
    <script src="src/api.js"></script>
    <script src="src/components.js"></script>
    <script src="src/pages/dashboard.js"></script>
    <script src="src/pages/produtos.js"></script>
    <script src="src/pages/materiais.js"></script>
    <script src="src/pages/vendas.js"></script>
    <script src="src/router.js"></script>
    <script src="src/index.js"></script>
</body>

</html>
